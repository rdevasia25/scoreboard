<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="home-score-section">
                <h3>HOME</h3>
                <h1 id="home-count">0</h1>
                <div class="increment-div">
                    <div class="increment-elmt">
                        <button onclick="homeIncrement1()">+1</button>
                    </div>
                    <div class="increment-elmt">
                        <button onclick="homeIncrement2()">+2</button>
                    </div>
                    <div class="increment-elmt">
                        <button onclick="homeIncrement3()">+3</button>
                    </div>
                </div>
            </div>
            <div id="guest-score-section">
                <h3>AWAY</h3>
                <h1 id="guest-count">0</h1>
                <div class="increment-div">
                    <div class="increment-elmt">
                        <button onclick="guestIncrement1()">+1</button>
                    </div>
                    <div class="increment-elmt">
                        <button onclick="guestIncrement2()">+2</button>
                    </div>
                    <div class="increment-elmt">
                        <button onclick="guestIncrement3()">+3</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
